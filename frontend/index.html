<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUGAMA - Say No More</title>
  <link rel="icon" href="./assets/img/icon-test-1-removebg-preview.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/index.css">
</head>
<body>

  <div id="auth-section" class="auth-wrap" style="display:flex">
    <div class="auth-card">
      <img src="./assets/img/lgm-icon-removebg-preview.png" width="150">
      <h1 id="auth-title">Login</h1>
      <input type="text" id="reg-username" placeholder="Nombre de usuario" style="display:none">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button id="btn-main" onclick="handleLogin()">Entrar</button>
      <p id="toggle-text">¿No tenés cuenta? <a href="#" onclick="showRegister()">Registrate acá</a></p>
    </div>
  </div>

  <div id="game-section" style="display:none">
    <div class="game-wrap">
      <header>
        <img src="./assets/img/lgm-icon-removebg-preview.png" width="115">
        <button onclick="handleLogout()">Cerrar sesión</button>
      </header>

      <div class="stats">
        <div class="stat"><span>Usuario</span><strong id="user-name">—</strong></div>
        <div class="stat"><span>Puntos</span><strong id="user-points">0</strong></div>
        <div class="stat"><span>Estrellas⭐</span><strong id="user-stars">0</strong></div>
        <div class="stat"><span>Intento</span><strong id="attempt-count">1 / 6</strong></div>
      </div>

      <div class="genre-row">
        <label for="genre-select">Género:</label>
        <select id="genre-select" onchange="changeGenre()">
          <option value="">Todos (Azar)</option>
        </select>
      </div>

      <div id="player-container">
        <div class="dots" id="dots">
          <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <!-- REPRODUCTOR ESTILO SONGLES -->
        <div class="songles-player">
          <div class="songles-header">
            <span id="current-limit-display" class="badge">0.5s</span>
            <span class="songles-time-text" id="songles-time-text">0.0s</span>
          </div>
          <div class="songles-bar-wrap" id="songles-bar-wrap">
            <!-- Segmentos generados desde JS -->
          </div>
          <button class="songles-play-btn" id="songles-play-btn" onclick="togglePlay()">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
          </button>
        </div>

        <!-- Audio oculto, solo para reproducción -->
        <audio id="song-preview" style="display:none" preload="auto"></audio>

        <p id="feedback-message">¡Dale Play para empezar!</p>
      </div>

      <div id="song-info" style="display:none">
        <img id="album-cover" src="" alt="Portada">
        <p id="song-details"></p>
      </div>

      <div class="guess-area">
        <input type="text" id="guess-input" list="songs-list" placeholder="¿Qué canción es?" oninput="handleSearch(this.value)">
        <datalist id="songs-list"></datalist>
        <button onclick="handleCheck()">Adivinar</button>
        <button onclick="handleSkip()" id="skip-btn" class="secondary">Skip</button>
        <button onclick="loadNewSong()" id="next-btn" class="ghost">Saltar canción</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">© Lugama. Todos los derechos reservados.</footer>

  <script src="./js/index.js"></script>
</body>
</html>
